<!DOCTYPE html>
<html>
<head>
  <title>Mandarin Lexical Tone Experiment</title>
  <meta charset="utf-8">
  <link rel="icon" href="data:,">

  <!-- LOCAL, version-locked to v7.3.0 -->
  <script src="jspsych/dist/jspsych.js"></script>
  <link href="jspsych/dist/jspsych.css" rel="stylesheet" type="text/css" />
  <script src="jspsych/dist/plugin-html-button-response.js"></script>
  <script src="jspsych/dist/plugin-audio-button-response.js"></script>
  <script src="jspsych/dist/plugin-survey-multi-choice.js"></script>

  <!-- survey plugin (language-background questionnaire).
       NOTE: this plugin versions on a SEPARATE line from the 1.1.3 plugins above;
       the v7.3-compatible release is 1.0.1. It bundles SurveyJS internally, so no
       extra SurveyJS <script> is needed, but it DOES need its own stylesheet.
       To host locally: copy the plugin's browser build to plugin-survey.js and its
       css/survey.css into jspsych/dist/ (filenames below match your local convention). -->
  <script src="jspsych/dist/plugin-survey.js"></script>
  <link href="jspsych/dist/survey.css" rel="stylesheet" type="text/css" />

  <!-- CDN equivalents (uncomment to preview without the jspsych/ folder)
  <script src="https://unpkg.com/jspsych@7.3.0"></script>
  <link href="https://unpkg.com/jspsych@7.3.0/css/jspsych.css" rel="stylesheet" />
  <script src="https://unpkg.com/@jspsych/plugin-html-button-response@1.1.3"></script>
  <script src="https://unpkg.com/@jspsych/plugin-audio-button-response@1.1.3"></script>
  <script src="https://unpkg.com/@jspsych/plugin-survey-multi-choice@1.1.3"></script>
  <script src="https://unpkg.com/@jspsych/plugin-survey@1.0.1"></script>
  <link href="https://unpkg.com/@jspsych/plugin-survey@1.0.1/css/survey.css" rel="stylesheet" />
  -->

  <!-- our experiment logic.
       survey_language_background.js DEFINES pushLanguageBackgroundSurvey();
       experiment.js CALLS it, so the survey module must load first.
       Both are deferred, and deferred scripts run in document order. -->
  <script src="survey_language_background.js" defer></script>
  <script src="experiment.js" defer></script>
</head>
<body></body>
</html>
