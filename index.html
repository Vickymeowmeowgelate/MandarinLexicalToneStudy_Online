  <!-- LOCAL, version-locked v8: jspsych 8.2.2; core plugins 2.1.x; extension-mouse-tracking 1.2.0;
       plugin-survey 4.0.0 (SurveyJS 2.3); plugin-pipe 0.6.0 (the v8 line).
       Filenames are unchanged from v7 — the v8 dist archive uses the same names — so only
       the files themselves were swapped, not these <script> lines. -->
  <script src="jspsych/dist/jspsych.js"></script>
  <link  href="jspsych/dist/jspsych.css" rel="stylesheet" type="text/css" />
  <script src="jspsych/dist/plugin-html-keyboard-response.js"></script>
  <script src="jspsych/dist/plugin-html-button-response.js"></script>
  <script src="jspsych/dist/plugin-audio-keyboard-response.js"></script>
  <script src="jspsych/dist/plugin-audio-button-response.js"></script>
  <script src="jspsych/dist/plugin-survey-multi-choice.js"></script>
  <script src="jspsych/dist/plugin-survey-text.js"></script>
  <script src="jspsych/dist/plugin-preload.js"></script>
  <script src="jspsych/dist/extension-mouse-tracking.js"></script>
  <script src="https://unpkg.com/@jspsych-contrib/plugin-pipe"></script>

  <!-- language-background survey (SurveyJS); v8 line is plugin-survey 4.0.0 / SurveyJS 2.3 -->
  <script src="jspsych/dist/plugin-survey.js"></script>
  <link  href="jspsych/dist/survey.css" rel="stylesheet" type="text/css" />

  <!-- DataPipe save + getCondition assignment -->
  <script src="jspsych/dist/plugin-pipe.js"></script>

  <!-- CSV parsing -->
  <script src="jspsych/dist/papaparse.min.js"></script>

  <!-- CDN equivalents (uncomment to preview without the jspsych/ folder; v8 set.

  <link  href="https://unpkg.com/jspsych@8.2.2/css/jspsych.css" rel="stylesheet" />
  <script src="https://unpkg.com/@jspsych/plugin-html-keyboard-response@2.1.0"></script>
  <script src="https://unpkg.com/@jspsych/plugin-html-button-response@2.1.0"></script>
  <script src="https://unpkg.com/@jspsych/plugin-audio-keyboard-response@2.1.0"></script>
  <script src="https://unpkg.com/@jspsych/plugin-audio-button-response@2.1.0"></script>
  <script src="https://unpkg.com/@jspsych/plugin-survey-multi-choice@2.1.0"></script>
  <script src="https://unpkg.com/@jspsych/plugin-survey-text@2.1.0"></script>

  <script src="https://unpkg.com/papaparse@5.4.1/papaparse.min.js"></script>
  -->

  <style>
    /* larger type overall */
    .jspsych-display-element { font-size: 21px; }
    .jspsych-content { max-width: 92%; line-height: 1.7; }

    /* six forced-choice options, 3 top / 3 bottom.
       v8: the plugin sets display:grid + the 3×2 dimensions inline
       (button_layout:"grid", grid_rows:2, grid_columns:3 in experiment.js);
       here we only style spacing / width / alignment so nothing fights it. */
    #jspsych-audio-button-response-btngroup {
      gap: 48px 64px;
      width: min(860px, 92vw);
      margin: 56px auto;
      justify-items: center; align-items: center;
    }
    #jspsych-audio-button-response-btngroup .jspsych-btn {
      font-size: 2.1rem; padding: 20px 30px; min-width: 150px; border-radius: 12px;
    }
    /* single centered buttons (start / beep / completion) */
    #jspsych-html-button-response-btngroup { display: flex; justify-content: center; margin-top: 40px; }
    #jspsych-html-button-response-btngroup .jspsych-btn {
      font-size: 1.5rem; padding: 16px 36px; border-radius: 12px;
    }
  </style>

  <!-- our logic. survey_language_background.js DEFINES pushLanguageBackgroundSurvey();
       experiment.js CALLS it, so the survey module loads first. Both deferred. -->
  <script src="survey_language_background.js" defer></script>
  <script src="experiment.js" defer></script>
</head>

</html>
